<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VidMac10 — Animated Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;background:transparent;overflow:hidden}
.stage{position:relative;width:100%;aspect-ratio:16/5;overflow:hidden;display:flex;align-items:center;color:#f7f7f7;font-family:Arial,Helvetica,sans-serif;background:transparent;isolation:isolate}
.avatar-wrap{position:absolute;left:0;top:0;width:35%;height:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.avatar{height:96%;width:100%;object-fit:contain;object-position:center bottom;filter:grayscale(1) contrast(1.1) drop-shadow(0 0 12px #aaa);animation:avatarFloat 4s ease-in-out infinite;transform-origin:bottom center}
.content{position:absolute;left:34%;right:2%;top:12%;bottom:12%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3%;padding:2% 2.5%;border:1px solid rgba(255,255,255,.38);background:linear-gradient(100deg,rgba(0,0,0,.10),rgba(0,0,0,.72) 22%,rgba(0,0,0,.68) 78%,rgba(0,0,0,.08));box-shadow:0 0 26px rgba(0,0,0,.24);clip-path:polygon(2% 0,98% 0,100% 14%,100% 86%,98% 100%,2% 100%,0 86%,0 14%)}
.brand{font-weight:1000;letter-spacing:.09em;line-height:.95;font-size:clamp(22px,5.2vw,84px);color:#f7f7f7;text-shadow:0 2px 0 #777,0 5px 16px #000,-2px 0 #999;animation:brandGlow 4s ease-in-out infinite}
.brand small{display:block;font-size:.26em;letter-spacing:.3em;margin-bottom:.4em;color:#c9c9c9}
.username{font-size:clamp(20px,4.2vw,66px);font-weight:1000;font-style:italic;letter-spacing:.06em;text-transform:uppercase;color:#e9e9e9;text-shadow:0 0 8px #fff,0 5px 0 #333;animation:glitch 6s infinite}
.message{width:100%;min-height:1.8em;padding:.35em .5em;border-top:1px solid #ddd;border-bottom:1px solid #777;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(10,10,10,.92),rgba(0,0,0,.35));font:700 clamp(12px,1.9vw,30px)/1.3 monospace;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 0 9px #fff;box-shadow:0 0 15px rgba(255,255,255,.06)}
.cursor{display:inline-block;width:.6ch;height:1em;vertical-align:-.13em;background:#fff;margin-left:.15em;animation:blink .7s steps(1) infinite}
@keyframes brandGlow{0%,100%{filter:brightness(.95)}50%{filter:brightness(1.22)}}\n@keyframes avatarFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-.8%) scale(1.025)}}
@keyframes glitch{0%,92%,100%{transform:translateX(0)}93%{transform:translateX(2px)}95%{transform:translateX(-2px)}97%{transform:translateX(1px)}}
@keyframes blink{50%{opacity:0}}
@media(max-width:600px){.content{left:32%;right:2%;padding:1% 1.5%}.brand{font-size:clamp(18px,5vw,36px)}.message{font-size:clamp(10px,2vw,16px)}}\n@media(prefers-reduced-motion:reduce){.avatar,.username,.brand{animation:none}}
</style></head>
<body>
<main class="stage">
 <div class="avatar-wrap"><img class="avatar" src="./vidmac-avatar.webp" alt="VidMac10 Roblox avatar"></div>
 <section class="content">
  <div class="brand"><small>◈ ROBLOX ◈</small><div class="username">VidMac10</div></div>
  <div class="message"><span id="typed">WELCOME TO MY STREAM</span><span class="cursor"></span></div>
 </section>
</main>
<script>
(()=>{const el=document.getElementById('typed');const messages=['WELCOME TO MY STREAM','JANGAN LUPA TAP2 & FOLLOW GUYS!'];let m=0,i=0,erase=false,wait=0;function tick(){const target=messages[m];if(wait>0){wait--;setTimeout(tick,100);return}if(!erase){i=Math.min(i+1,target.length);el.textContent=target.slice(0,i);if(i>=target.length){wait=22;erase=true}}else{i=Math.max(0,i-1);el.textContent=target.slice(0,i);if(i===0){erase=false;m=(m+1)%messages.length;wait=5}}setTimeout(tick,erase?32:62)}setTimeout(()=>{i=0;el.textContent='';tick()},250)})();
</script></body></html>
