<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Zaryvel Blox — Animated Banner v4</title>
<style>
:root{--banner-width:100vw;--duration:7s}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:auto;min-height:0;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.canvas{position:relative;width:100%;height:auto;display:block;overflow:hidden;background:transparent;isolation:isolate}
.frame{position:relative;display:block;width:100%;max-width:1983px;height:auto;margin:0 auto;line-height:0;overflow:hidden;transform-origin:center;animation:float 2.8s ease-in-out infinite !important;filter:drop-shadow(0 0 0 rgba(255,255,255,0));will-change:transform;}
.banner{display:block;width:100%;max-width:100%;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;filter:contrast(1.08) brightness(.98);transform-origin:center;animation:breath 4s ease-in-out infinite alternate !important;will-change:transform,filter}
.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,.32) 48%,rgba(255,255,255,.06) 54%,transparent 64%);transform:translateX(-130%);mix-blend-mode:screen;animation:shine 3.5s ease-in-out infinite !important}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E")}
@keyframes breath{0%{transform:scale(1);filter:contrast(1.06) brightness(.88)}50%{transform:scale(1.06);filter:contrast(1.2) brightness(1.18)}100%{transform:scale(1.12);filter:contrast(1.08) brightness(.95)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shine{0%{transform:translateX(-140%)}100%{transform:translateX(140%)}}
</style>
</head>
<body>
<main class="canvas" aria-label="Zaryvel Blox animated banner">
  <div class="frame">
    <img class="banner" src="https://raw.githubusercontent.com/zaryvel/zaryvel-runtime-text/main/banner%20zaryvelblox.webp" alt="Zaryvel Blox — Robux Top Up Store" draggable="false">
    <div class="grain"></div>
  </div>
</main>
</body>
</html>
