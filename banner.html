<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Zaryvel Blox — Animated Banner</title>
<style>
:root{--banner-width:100vw;--duration:7s}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.canvas{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:transparent;isolation:isolate}
.frame{position:relative;width:100%;max-width:1983px;line-height:0;overflow:hidden;transform-origin:center;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 0 rgba(255,255,255,0));}
.banner{display:block;width:100%;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;filter:contrast(1.08) brightness(.98);transform-origin:center;animation:breath var(--duration) ease-in-out infinite alternate}
.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,.32) 48%,rgba(255,255,255,.06) 54%,transparent 64%);transform:translateX(-130%);mix-blend-mode:screen;animation:shine 5s ease-in-out infinite}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E")}
@keyframes breath{0%{transform:scale(1);filter:contrast(1.06) brightness(.92)}50%{filter:contrast(1.12) brightness(1.08)}100%{transform:scale(1.10);filter:contrast(1.08) brightness(.98)}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes shine{0%,15%{transform:translateX(-130%)}65%,100%{transform:translateX(130%)}}
@media(prefers-reduced-motion:reduce){.frame,.banner,.frame:after{animation:none}}
</style>
</head>
<body>
<main class="canvas" aria-label="Zaryvel Blox animated banner">
  <div class="frame">
    <img class="banner" src="https://raw.githubusercontent.com/zaryvel/zaryvel-runtime-text/main/banner%20zaryvelblox.webp" alt="Zaryvel Blox — Robux Top Up Store" draggable="false">
    <div class="grain"></div>
  </div>
</main>
</body>
</html>
