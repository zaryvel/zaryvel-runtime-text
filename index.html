<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaryvel Blox Running Text</title>
<style>
:root{--speed:26s;--size:25px;--height:64px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#f5f5f5}
.stage{width:100vw;height:100vh;display:flex;align-items:flex-end;padding-bottom:5vh}.ticker{height:var(--height);width:100%;display:flex;align-items:center;overflow:hidden;background:rgba(7,7,9,.9);border-top:1px solid #777;border-bottom:1px solid #333;box-shadow:0 -8px 35px #0003}
.brand{height:100%;padding:0 20px;display:flex;align-items:center;gap:12px;flex:none;background:linear-gradient(135deg,#f4f4f5,#a1a1aa,#52525b);color:#08080a;font-weight:1000;letter-spacing:1px;font-size:15px;border-right:1px solid #aaa;white-space:nowrap}
.mark{width:32px;height:32px;border:2px solid #171719;display:grid;place-items:center;transform:rotate(45deg);font-size:21px}.mark span{transform:rotate(-45deg)}.brand small{display:block;font-size:7px;letter-spacing:2px;margin-top:3px}
.live{flex:none;margin:0 17px;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:1000;letter-spacing:1px}.dot{height:8px;width:8px;border-radius:50%;background:#fb3656;box-shadow:0 0 10px #fb3656;animation:pulse 1.3s infinite}
.window{flex:1;min-width:0;overflow:hidden;height:100%;display:flex;align-items:center}.track{display:flex;align-items:center;width:max-content;white-space:nowrap;animation:scroll var(--speed) linear infinite}.ticker:hover .track{animation-play-state:paused}
.msg{font-size:var(--size);font-weight:900;letter-spacing:.3px;padding:0 28px;text-shadow:0 2px 9px #000}.sep{color:#d4d4d8;padding-left:14px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes pulse{50%{opacity:.4;transform:scale(.8)}}
body.transparent .ticker{background:transparent;border:0;box-shadow:none}body.transparent .brand{background:#09090be0;color:#fff;border:1px solid #555}body.transparent .mark{border-color:white}
.controls{position:fixed;right:18px;top:18px;z-index:10;width:min(360px,calc(100vw - 36px));padding:18px;border:1px solid #45454d;border-radius:15px;background:#0b0b0df2;box-shadow:0 18px 60px #0008;backdrop-filter:blur(12px)}
.controls h1{font-size:17px;margin:0 0 6px}.controls p{font-size:11px;line-height:1.5;color:#aaa;margin:0 0 12px}.controls label{display:block;margin:12px 0 5px;font-size:11px;font-weight:bold;color:#ddd}
.controls textarea,.controls select{width:100%;padding:9px;border:1px solid #38383e;border-radius:8px;background:#18181b;color:white;font:12px Arial}.controls textarea{min-height:74px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.controls button{width:100%;padding:11px;margin-top:10px;border:0;border-radius:8px;background:linear-gradient(135deg,#f4f4f5,#a1a1aa);color:#08080a;font-weight:900;font-size:11px;cursor:pointer}.controls button.alt{background:#242429;color:white;border:1px solid #444}
.controls .hint{font-size:10px;color:#999;margin:10px 0 0}.clean{padding-bottom:0}.clean .controls{display:none}
@media(max-width:700px){:root{--size:18px;--height:52px}.brand{padding:0 12px;gap:8px;font-size:12px}.mark{width:26px;height:26px;font-size:16px}.brand small{font-size:6px}.live{margin:0 10px;font-size:9px}.msg{padding:0 16px}}
</style></head><body>
<div class="stage" id="stage">
<section class="controls" id="controls"><h1>ZARYVEL BLOX — Running Text</h1><p>Atur pesan dan tampilan ticker. Klik Mode OBS untuk menyembunyikan panel ini.</p>
<label for="messages">Pesan berjalan (pisahkan dengan |)</label><textarea id="messages">TOP UP ROBUX MURAH | ROBUX FAST TERSEDIA | USERNAME PENDING 5 HARI | ORDER SEKARANG DI ZARYVEL BLOX</textarea>
<div class="grid"><div><label for="speed">Kecepatan</label><select id="speed"><option value="38">Pelan</option><option value="26" selected>Normal</option><option value="16">Cepat</option></select></div><div><label for="size">Ukuran teks</label><select id="size"><option value="18">Kecil</option><option value="25" selected>Normal</option><option value="32">Besar</option></select></div></div>
<label for="style">Background</label><select id="style"><option value="bar">Bar hitam-silver</option><option value="transparent">Transparan</option></select>
<button id="apply">TERAPKAN PESAN</button><button class="alt" id="obs">MODE OBS (SEMBUNYIKAN KONTROL)</button><button class="alt" id="show" hidden>TAMPILKAN KONTROL</button><p class="hint">Rekomendasi Browser Source: 1920 × 1080. Ticker berada di bawah layar.</p></section>
<div class="ticker"><div class="brand"><div class="mark"><span>Z</span></div><div>ZARYVEL<small>BLOX • ROBUX STORE</small></div></div><div class="live"><span class="dot"></span> LIVE</div><div class="window"><div class="track" id="track"></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id), stage=$('stage'),track=$('track');
function render(){const items=$('messages').value.split('|').map(x=>x.trim()).filter(Boolean);const list=items.length?items:['TOP UP ROBUX MURAH','ORDER DI ZARYVEL BLOX'];const html=list.map(s=>'<span class="msg">'+s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+' <span class="sep">✦</span></span>').join('');track.innerHTML=html+html;track.style.animationDuration=$('speed').value+'s'}
$('apply').onclick=render;$('speed').onchange=render;$('size').onchange=()=>document.documentElement.style.setProperty('--size',$('size').value+'px');$('style').onchange=()=>document.body.classList.toggle('transparent',$('style').value==='transparent');
$('obs').onclick=()=>{stage.classList.add('clean');$('show').hidden=false};$('show').onclick=()=>{stage.classList.remove('clean');$('show').hidden=true};render();
</script></body></html>
